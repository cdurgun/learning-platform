course.description.default=Free, hands-on {0} lessons with real code examples and quizzes, in English and Turkish.
course.java.description=Learn Java from the basics to concurrency: control flow, OOP, exceptions, generics, collections and streams, with real code examples and quizzes.
course.spring-boot.description=Learn Spring Boot step by step: Spring Core, Spring MVC, Spring Data JPA, microservices and advanced topics, with real code examples and quizzes.
course.react.description=Learn React from JSX and components to hooks, routing, state management, testing and deployment, with simple examples and practice projects.
course.ai.description=AI for developers: machine learning basics, large language models, tools and MCP, AI agents, and AI-assisted development with Claude Code.
course.postgresql.description=Learn PostgreSQL and SQL: data types, constraints, joins, aggregation, window functions, indexes with EXPLAIN, transactions and concurrency.
course.git-github.description=Learn Git and GitHub: commits, branches and merging, pull requests, rebase, merge conflicts, stash and a practical team workflow.
course.docker.description=Docker for Java developers: images and Dockerfiles, networking, volumes, Docker Compose and production-ready Spring Boot containers.

