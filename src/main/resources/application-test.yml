# NOT: Bu profil şimdilik dev ile aynı Postgres sunucusunu, ayrı bir DB adıyla kullanır.
# `learning_test` veritabanını elle oluşturman gerekir. İleride (Faz 3+) bunun yerine
# Testcontainers ile her test çalıştırmasında izole, tek kullanımlık bir Postgres
# container'ı ayağa kaldırmak çok daha sağlam olur.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/learning_test
    username: learning
    password: learning
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Google girişinin testlerde kurulu olması için SAHTE bir istemci (gerçek bir Google
# projesine ait DEĞİL, gizli bir değer de değil). Testler Google'a hiç bağlanmaz.
app:
  auth:
    google:
      client-id: test-client-id.apps.googleusercontent.com
      client-secret: test-client-secret
