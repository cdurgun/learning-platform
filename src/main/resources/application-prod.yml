# Üretimde tüm gizli bilgiler ortam değişkenlerinden okunur, repoya asla yazılmaz.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true

app:
  base-url: https://www.learnforgex.com

logging:
  level:
    com.cdurgun.learning: INFO
    org.hibernate.SQL: WARN
