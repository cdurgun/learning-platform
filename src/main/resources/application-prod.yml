# Üretimde tüm gizli bilgiler ortam değişkenlerinden okunur, repoya asla yazılmaz.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true

# Uygulama TLS'i sonlandıran bir proxy'nin (Railway) arkasında çalışır. Bu ayar olmadan
# Spring, isteği düz http sanıp yönlendirmeleri (ör. login'e 302) "http://" ile üretiyordu.
server:
  forward-headers-strategy: framework

app:
  base-url: https://www.learnforgex.com
  cache-static-resource-chain: true

logging:
  level:
    com.cdurgun.learning: INFO
    org.hibernate.SQL: WARN
