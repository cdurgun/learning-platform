<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' | LearnForgeX'">Kurs</title>
    <meta name="description" th:content="${courseDescription}"/>

    <!-- hreflang: topic.html'deki kuralla aynı -- yalnızca bu kursun GERÇEKTEN yayında
         konusu olan dillere verilir, x-default İngilizce'ye (yoksa mevcut dile) düşer. -->
    <link rel="canonical" th:href="${baseUrl + '/' + language.code + '/courses/' + course.slug()}"/>
    <link rel="alternate" th:hreflang="${language.code}"
          th:href="${baseUrl + '/' + language.code + '/courses/' + course.slug()}"/>
    <link th:if="${otherLanguageAvailable}" rel="alternate" th:hreflang="${otherLanguage.code}"
          th:href="${baseUrl + '/' + otherLanguage.code + '/courses/' + course.slug()}"/>
    <link rel="alternate" hreflang="x-default"
          th:href="${baseUrl + '/' + (language.code == 'en' ? 'en' : (otherLanguageAvailable ? 'en' : 'tr')) + '/courses/' + course.slug()}"/>

    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="LearnForgeX"/>
    <meta property="og:title" th:content="${pageTitle}"/>
    <meta property="og:description" th:content="${courseDescription}"/>
    <meta property="og:url" th:content="${baseUrl + '/' + language.code + '/courses/' + course.slug()}"/>
    <meta property="og:image" th:content="${baseUrl + '/img/og-image.png'}"/>
    <meta property="og:locale" th:content="${language.code == 'tr'} ? 'tr_TR' : 'en_US'"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" th:content="${pageTitle}"/>
    <meta name="twitter:description" th:content="${courseDescription}"/>
    <meta name="twitter:image" th:content="${baseUrl + '/img/og-image.png'}"/>

    <!-- CDATA sarmalayıcı BİLİNÇLİ OLARAK yok -- bkz. topic.html'deki açıklama. -->
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": /*[[${course.name()}]]*/ "Kurs",
      "description": /*[[${courseDescription}]]*/ "Açıklama",
      "url": /*[[${baseUrl + '/' + language.code + '/courses/' + course.slug()}]]*/ "https://www.learnforgex.com",
      "inLanguage": /*[[${language.code}]]*/ "en",
      "provider": {
        "@type": "Organization",
        "name": "LearnForgeX",
        "url": /*[[${baseUrl}]]*/ "https://www.learnforgex.com"
      }
    }
    </script>
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": /*[[#{breadcrumb.home}]]*/ "Home",
          "item": /*[[${baseUrl + '/' + language.code}]]*/ "https://www.learnforgex.com"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": /*[[${course.name()}]]*/ "Kurs"
        }
      ]
    }
    </script>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-lg-10 p-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/{lang}(lang=${language.code})}" th:text="#{breadcrumb.home}">Ana Sayfa</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${course.name()}">Kurs</li>
                </ol>
            </nav>

            <h1 class="mb-2" th:text="${pageTitle}">Kurs</h1>
            <p class="lead mb-2" th:text="${courseDescription}">Açıklama</p>
            <p class="text-muted small mb-4"
               th:text="#{course.summary(${topicCount}, ${#lists.size(course.categories())})}">45 ders, 8 kategori</p>

            <!-- Kategori başlığının id'si kategori slug'ıdır: konu sayfasındaki breadcrumb
                 buraya /courses/{slug}#{kategori-slug} ile bağlanır. -->
            <section th:each="category : ${course.categories()}" class="mb-4" th:id="${category.slug()}">
                <h2 class="h4" th:text="${category.name()}">Kategori</h2>

                <div class="row row-cols-1 row-cols-md-3 g-3">
                    <div class="col" th:each="topicItem : ${category.topics()}">
                        <div class="card h-100 shadow-sm position-relative">
                            <div class="card-body">
                                <h3 class="card-title h6" th:text="${topicItem.title()}">Konu</h3>
                                <p class="card-text small text-muted" th:text="${topicItem.summary()}">Özet</p>
                                <div class="mb-2">
                                    <span class="badge text-bg-secondary"
                                          th:text="#{${'difficulty.' + topicItem.difficulty()}}">Zorluk</span>
                                    <span class="text-muted small ms-1"
                                          th:if="${topicItem.estimatedMinutes() != null}"
                                          th:text="${topicItem.estimatedMinutes()} + ' ' + #{time.minutesShort}">15 dk</span>
                                </div>
                                <a class="stretched-link small"
                                   th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${topicItem.slug()})}"
                                   th:text="#{home.explore}">İncele &rarr;</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
