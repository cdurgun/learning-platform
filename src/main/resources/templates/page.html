<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{${'page.' + page.slug + '.title'}} + ' | LearnForgeX'">LearnForgeX</title>
    <meta name="description" th:content="#{${'page.' + page.slug + '.description'}}"/>
    <meta th:unless="${page.indexable}" name="robots" content="noindex"/>

    <!-- Sabit sayfaların iki dil sürümü de her zaman var (bkz. PageController). -->
    <link rel="canonical" th:href="${baseUrl + '/' + language.code + '/' + page.slug}"/>
    <link rel="alternate" hreflang="en" th:href="${baseUrl + '/en/' + page.slug}"/>
    <link rel="alternate" hreflang="tr" th:href="${baseUrl + '/tr/' + page.slug}"/>
    <link rel="alternate" hreflang="x-default" th:href="${baseUrl + '/en/' + page.slug}"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-lg-10 p-4">
            <h1 class="mb-4" th:text="#{${'page.' + page.slug + '.title'}}">Sayfa</h1>
            <article class="markdown-content static-page" th:utext="${contentHtml}"></article>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
