<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${quizTitle} + ' | LearnForgeX'">Quiz</title>
    <!-- Quiz Area sayfaları içerik değil, kapsamı gerçek zamanlı/rastgele değişen bir
         araç -- indexlenmesi anlamlı değil (bkz. topic.html'deki benzer noindex kararı,
         Faz 65 notu). -->
    <meta name="robots" content="noindex, follow"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-lg-9 p-4">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/{lang}(lang=${language.code})}" th:text="#{breadcrumb.home}">Home</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/{lang}/quiz(lang=${language.code})}" th:text="#{nav.quiz}">QUIZ</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${quizTitle}">Quiz</li>
                </ol>
            </nav>

            <h1 class="mb-4" th:text="${quizTitle}">Quiz</h1>

            <!-- Kapsamda hiç uygun (PUBLISHED) soru yoksa (örn. henüz içerik/ingestion
                 yapılmamış bir kategori) -- bu bir hata DEĞİL, dostane bir mesajla
                 karşılanır, boş bir form/submit butonu GÖSTERİLMEZ. -->
            <div th:if="${#lists.isEmpty(quizQuestions)}" class="alert alert-info" th:text="#{quiz.noQuestions}">
                No questions are available for this quiz yet.
            </div>

            <div th:unless="${#lists.isEmpty(quizQuestions)}"
                 th:replace="~{fragments/quiz :: quizSection(${quizQuestions}, @{/{lang}/quiz/{definitionSlug}/submit(lang=${language.code}, definitionSlug=${definitionSlug})})}"></div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
<script th:src="@{/js/quiz.js}"></script>

</body>
</html>
