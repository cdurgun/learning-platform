<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{home.heading}">LearnForgeX</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-md-9 col-lg-10 p-4">
            <h1 class="mb-2" th:text="#{home.heading}">Java Öğrenim Platformu</h1>
            <p class="text-muted mb-4" th:text="#{home.subheading}">Türkçe ve İngilizce, ücretsiz Java içerikleri.</p>

            <div th:if="${#lists.isEmpty(nav)}" class="alert alert-secondary" th:text="#{home.noCourses}">
                Henüz yayınlanmış bir kurs yok.
            </div>

            <div th:each="course : ${nav}" class="mb-5">
                <h2 th:text="${course.name()}">Kurs</h2>

                <div th:each="category : ${course.categories()}" class="mb-3">
                    <h5 th:text="${category.name()}">Kategori</h5>

                    <div class="row row-cols-1 row-cols-md-3 g-3">
                        <div class="col" th:each="topicItem : ${category.topics()}">
                            <div class="card h-100 shadow-sm position-relative">
                                <div class="card-body">
                                    <h6 class="card-title" th:text="${topicItem.title()}">Konu</h6>
                                    <p class="card-text small text-muted" th:text="${topicItem.summary()}">Özet</p>
                                    <div class="mb-2">
                                        <span class="badge text-bg-secondary"
                                              th:text="#{${'difficulty.' + topicItem.difficulty()}}">Zorluk</span>
                                        <span class="text-muted small ms-1"
                                              th:if="${topicItem.estimatedMinutes() != null}"
                                              th:text="${topicItem.estimatedMinutes()} + ' ' + #{time.minutesShort}">15 dk</span>
                                    </div>
                                    <a class="stretched-link small"
                                       th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${topicItem.slug()})}"
                                       th:text="#{home.explore}">
                                        İncele &rarr;
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
