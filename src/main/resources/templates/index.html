<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{home.heading}">LearnForgeX</title>
    <meta name="description" th:content="#{home.subheading}"/>

    <!-- Anasayfanın iki dil sürümü (EN/TR) her zaman var (bkz. HomeController#index) —
         topic sayfasındaki gibi otherLanguageAvailable kontrolüne gerek yok. -->
    <link rel="canonical" th:href="${baseUrl + '/' + language.code}"/>
    <link rel="alternate" hreflang="en" th:href="${baseUrl + '/en'}"/>
    <link rel="alternate" hreflang="tr" th:href="${baseUrl + '/tr'}"/>
    <link rel="alternate" hreflang="x-default" th:href="${baseUrl + '/en'}"/>

    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="LearnForgeX"/>
    <meta property="og:title" th:content="'LearnForgeX — ' + #{home.heading}"/>
    <meta property="og:description" th:content="#{home.subheading}"/>
    <meta property="og:url" th:content="${baseUrl + '/' + language.code}"/>
    <meta property="og:image" th:content="${baseUrl + '/img/og-image.png'}"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:locale" th:content="${language.code == 'tr'} ? 'tr_TR' : 'en_US'"/>
    <meta property="og:locale:alternate" th:content="${language.code == 'tr'} ? 'en_US' : 'tr_TR'"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" th:content="'LearnForgeX — ' + #{home.heading}"/>
    <meta name="twitter:description" th:content="#{home.subheading}"/>
    <meta name="twitter:image" th:content="${baseUrl + '/img/og-image.png'}"/>

    <!-- th:inline="javascript" + /*[[expr]]*/ işaretçileri: bu proje HTML5 (XHTML strict
         DEĞİL) çıktı ürettiği için bazı Thymeleaf örneklerinde görülen yorum-içi CDATA
         sarmalayıcıya gerek yok — o sarmalayıcı attoparser'ı script içeriğini yanlış
         parçalamaya iterek canlı ortamda gerçek bir TemplateInputException'a yol açtı,
         bu yüzden BİLİNÇLİ OLARAK eklenmedi — bkz. Faz 66 düzeltme notu, ve Mimari
         bölümündeki kalıcı kural. -->
    <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LearnForgeX",
      "url": /*[[${baseUrl}]]*/ "https://www.learnforgex.com",
      "inLanguage": /*[[${language.code}]]*/ "en",
      "publisher": {
        "@type": "Organization",
        "name": "LearnForgeX",
        "url": /*[[${baseUrl}]]*/ "https://www.learnforgex.com",
        "logo": /*[[${baseUrl + '/img/apple-touch-icon.png'}]]*/ "https://www.learnforgex.com/img/apple-touch-icon.png"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-md-9 col-lg-10 p-4">
            <h1 class="mb-2" th:text="#{home.heading}">Java Öğrenim Platformu</h1>
            <p class="text-muted mb-4" th:text="#{home.subheading}">Türkçe ve İngilizce, ücretsiz Java içerikleri.</p>

            <div th:if="${#lists.isEmpty(nav)}" class="alert alert-secondary" th:text="#{home.noCourses}">
                Henüz yayınlanmış bir kurs yok.
            </div>

            <div th:each="course : ${nav}" class="mb-5">
                <h2 th:text="${course.name()}">Kurs</h2>

                <div th:each="category : ${course.categories()}" class="mb-3">
                    <h5 th:text="${category.name()}">Kategori</h5>

                    <div class="row row-cols-1 row-cols-md-3 g-3">
                        <div class="col" th:each="topicItem : ${category.topics()}">
                            <div class="card h-100 shadow-sm position-relative">
                                <div class="card-body">
                                    <h6 class="card-title" th:text="${topicItem.title()}">Konu</h6>
                                    <p class="card-text small text-muted" th:text="${topicItem.summary()}">Özet</p>
                                    <div class="mb-2">
                                        <span class="badge text-bg-secondary"
                                              th:text="#{${'difficulty.' + topicItem.difficulty()}}">Zorluk</span>
                                        <span class="text-muted small ms-1"
                                              th:if="${topicItem.estimatedMinutes() != null}"
                                              th:text="${topicItem.estimatedMinutes()} + ' ' + #{time.minutesShort}">15 dk</span>
                                    </div>
                                    <a class="stretched-link small"
                                       th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${topicItem.slug()})}"
                                       th:text="#{home.explore}">
                                        İncele &rarr;
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
