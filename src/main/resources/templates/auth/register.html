<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{auth.register.title}">LearnForgeX</title>
    <meta name="robots" content="noindex"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4 py-5">
            <h1 class="h3 mb-4 text-center" th:text="#{auth.register.title}">Create Account</h1>

            <form method="post" th:action="@{/{lang}/register(lang=${language.code})}"
                  th:object="${registerForm}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label" for="email" th:text="#{auth.login.email}">Email</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           type="email" id="email" th:field="*{email}"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="displayName" th:text="#{auth.register.displayName}">Display Name</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('displayName')} ? 'is-invalid' : ''"
                           type="text" id="displayName" th:field="*{displayName}"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Display name error</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password" th:text="#{auth.login.password}">Password</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           type="password" id="password" th:field="*{password}"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                </div>
                <button class="btn btn-primary w-100" type="submit" th:text="#{auth.register.submit}">Register</button>
            </form>

            <p class="text-center text-muted small mt-3">
                <span th:text="#{auth.register.haveAccount}">Already have an account?</span>
                <a th:href="@{/{lang}/login(lang=${language.code})}" th:text="#{auth.register.loginLink}">Sign in</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
