<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{auth.google.link.title}">LearnForgeX</title>
    <meta name="robots" content="noindex"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar(hideMenuToggle=true)}"></div>

<!-- Google'ın doğruladığı e-posta mevcut bir hesapla eşleşti: e-posta eşleşmesi TEK BAŞINA
     bağlamaz (kayıtta e-postalar doğrulanmıyor), hesabın şifresi istenir (bkz.
     GoogleAccountService#link). E-posta formdan GÖNDERİLMEZ, session'daki doğrulanmış
     Google kimliğinden okunur. -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 py-5">
            <h1 class="h3 mb-3 text-center" th:text="#{auth.google.link.title}">Link your Google account</h1>
            <p class="text-muted"
               th:utext="#{auth.google.link.intro(${#strings.escapeXml(googleEmail)})}">
                A LearnForgeX account already exists for <strong>name@example.com</strong>.
                Enter its password to sign in with Google from now on.
            </p>

            <form method="post" th:action="@{/{lang}/login/google/link(lang=${language.code})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label" for="password" th:text="#{auth.login.password}">Password</label>
                    <input class="form-control" th:classappend="${passwordError} ? 'is-invalid' : ''"
                           type="password" id="password" name="password" required="required"
                           autocomplete="current-password" autofocus="autofocus"
                           th:attr="aria-describedby=${passwordError} ? 'passwordError' : null"/>
                    <div class="invalid-feedback" id="passwordError" th:if="${passwordError}"
                         th:text="#{auth.google.link.wrongPassword}">Incorrect password.</div>
                </div>
                <button class="btn btn-primary w-100" type="submit" th:text="#{auth.google.link.submit}">Link and sign in</button>
            </form>

            <form method="post" class="mt-2" th:action="@{/{lang}/login/google/cancel(lang=${language.code})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-link w-100" type="submit" th:text="#{auth.google.cancel}">Cancel</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
