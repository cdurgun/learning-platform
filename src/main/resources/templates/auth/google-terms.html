<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{auth.google.terms.title}">LearnForgeX</title>
    <meta name="robots" content="noindex"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar(hideMenuToggle=true)}"></div>

<!-- Google kimliği doğrulandı ama bağlı bir hesap yok: hesap, kayıt formundaki AYNI
     onay kutusu işaretlenmeden AÇILMAZ (bkz. GoogleSignInController#acceptTerms). -->
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 py-5">
            <h1 class="h3 mb-3 text-center" th:text="#{auth.google.terms.title}">Create your account</h1>
            <p class="text-center text-muted"
               th:utext="#{auth.google.terms.intro(${#strings.escapeXml(googleEmail)})}">
                You're signing in with Google as <strong>name@example.com</strong>.
            </p>

            <form method="post" th:action="@{/{lang}/login/google/terms(lang=${language.code})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-check mb-3">
                    <input class="form-check-input" th:classappend="${termsError} ? 'is-invalid' : ''"
                           type="checkbox" id="termsAccepted" name="termsAccepted" value="true"
                           th:attr="aria-describedby=${termsError} ? 'termsError' : null"/>
                    <label class="form-check-label small" for="termsAccepted"
                           th:utext="#{auth.register.terms(@{/{lang}/terms(lang=${language.code})}, @{/{lang}/privacy(lang=${language.code})})}">
                        I accept the Terms of Use and have read the Privacy Policy.
                    </label>
                    <div class="invalid-feedback" id="termsError" th:if="${termsError}" th:text="#{auth.validation.terms.required}">
                        Accept the Terms of Use to create an account.
                    </div>
                </div>
                <button class="btn btn-primary w-100" type="submit" th:text="#{auth.google.terms.submit}">Create account</button>
            </form>

            <form method="post" class="mt-2" th:action="@{/{lang}/login/google/cancel(lang=${language.code})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-link w-100" type="submit" th:text="#{auth.google.cancel}">Cancel</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
