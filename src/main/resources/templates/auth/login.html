<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{auth.login.title}">LearnForgeX</title>
    <meta name="robots" content="noindex"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4 py-5">
            <h1 class="h3 mb-4 text-center" th:text="#{auth.login.title}">Sign In</h1>

            <div class="alert alert-danger" th:if="${param.error != null}" th:text="#{auth.login.error}">
                Invalid email or password.
            </div>
            <div class="alert alert-success" th:if="${param.registered != null}" th:text="#{auth.login.registered}">
                Account created. Please sign in.
            </div>

            <form method="post" th:action="@{/{lang}/login(lang=${language.code})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label" for="username" th:text="#{auth.login.email}">Email</label>
                    <input class="form-control" type="email" id="username" name="username" required="required" autofocus="autofocus"/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password" th:text="#{auth.login.password}">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required="required"/>
                </div>
                <button class="btn btn-primary w-100" type="submit" th:text="#{auth.login.submit}">Sign in</button>
            </form>

            <p class="text-center text-muted small mt-3">
                <span th:text="#{auth.login.noAccount}">Don't have an account?</span>
                <a th:href="@{/{lang}/register(lang=${language.code})}" th:text="#{auth.login.registerLink}">Register</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
