<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="(${contentAvailable} ? (translation.seoTitle ?: translation.title) : topic.slug) + ' | LearnForgeX'">Konu</title>
    <meta th:if="${contentAvailable and translation.seoDescription != null}"
          name="description" th:content="${translation.seoDescription}"/>

    <!-- İçerik bu dilde yoksa (topic var ama TopicTranslation yayında değil / dosya
         eksik): ince/duplike içerik olarak indexlenmesin. Canonical'ı, varsa gerçek
         içeriğin olduğu diğer dile işaret ediyoruz — yoksa canonical hiç eklenmiyor
         (bkz. Faz 65 notu). -->
    <meta th:unless="${contentAvailable}" name="robots" content="noindex, follow"/>
    <link th:if="${!contentAvailable and otherLanguageAvailable}" rel="canonical"
          th:href="${baseUrl + '/' + otherLanguage.code + '/topics/' + topic.slug}"/>

    <th:block th:if="${contentAvailable}">
        <!-- Canonical: bu sayfanın path-bazlı kendi adresi (Faz 64) -->
        <link rel="canonical" th:href="${baseUrl + '/' + language.code + '/topics/' + topic.slug}"/>

        <!-- hreflang: yalnızca GERÇEKTEN yayında olan diller arasında bağlanır —
             otherLanguageAvailable=false iken diğer dile hreflang verilmiyor (o adres
             şu an içerik yok mesajı gösteriyor, Google'a "eşdeğer sayfa" diye
             sunulmamalı). x-default her zaman İngilizce'ye işaret eder, İngilizce bu
             konuda henüz yayında değilse (yalnızca TR varsa) mevcut tek sürüme
             (TR) düşer. -->
        <link rel="alternate" th:hreflang="${language.code}"
              th:href="${baseUrl + '/' + language.code + '/topics/' + topic.slug}"/>
        <link th:if="${otherLanguageAvailable}" rel="alternate" th:hreflang="${otherLanguage.code}"
              th:href="${baseUrl + '/' + otherLanguage.code + '/topics/' + topic.slug}"/>
        <link rel="alternate" hreflang="x-default"
              th:href="${baseUrl + '/' + (language.code == 'en' ? 'en' : (otherLanguageAvailable ? 'en' : 'tr')) + '/topics/' + topic.slug}"/>

        <!-- Open Graph / Twitter Card -->
        <meta property="og:type" content="article"/>
        <meta property="og:site_name" content="LearnForgeX"/>
        <meta property="og:title" th:content="${translation.seoTitle ?: translation.title}"/>
        <meta th:if="${translation.seoDescription != null}" property="og:description"
              th:content="${translation.seoDescription}"/>
        <meta property="og:url" th:content="${baseUrl + '/' + language.code + '/topics/' + topic.slug}"/>
        <meta property="og:image" th:content="${baseUrl + '/img/og-image.png'}"/>
        <meta property="og:image:width" content="1200"/>
        <meta property="og:image:height" content="630"/>
        <meta property="og:locale" th:content="${language.code == 'tr'} ? 'tr_TR' : 'en_US'"/>
        <meta th:if="${otherLanguageAvailable}" property="og:locale:alternate"
              th:content="${otherLanguage.code == 'tr'} ? 'tr_TR' : 'en_US'"/>
        <meta name="twitter:card" content="summary_large_image"/>
        <meta name="twitter:title" th:content="${translation.seoTitle ?: translation.title}"/>
        <meta th:if="${translation.seoDescription != null}" name="twitter:description"
              th:content="${translation.seoDescription}"/>
        <meta name="twitter:image" th:content="${baseUrl + '/img/og-image.png'}"/>

        <!-- JSON-LD (schema.org LearningResource): th:inline="javascript", /*[[expr]]*/
             işaretçileriyle Thymeleaf'in JS-context kaçışını (tırnak/özel karakter)
             kullanıyor — JSON-LD teknik olarak script içinde JS değil ama string
             kaçış kuralları (tırnak, ters bölü) aynı, bu yüzden bu projenin dışında
             da yaygın kullanılan bir kalıp. Bazı Thymeleaf örneklerinde görülen
             yorum-içi CDATA sarmalayıcı BİLİNÇLİ OLARAK eklenmedi — bu proje HTML5
             çıktı üretiyor (XHTML strict değil), ve o sarmalayıcı attoparser'ı script
             içeriğini yanlış parçalamaya iterek canlı ortamda gerçek bir
             TemplateInputException'a yol açtı (bkz. Faz 66 düzeltme notu, ve Mimari
             bölümündeki kalıcı kural). -->
        <script type="application/ld+json" th:inline="javascript">
        {
          "@context": "https://schema.org",
          "@type": "LearningResource",
          "name": /*[[${translation.seoTitle ?: translation.title}]]*/ "Konu",
          "description": /*[[${translation.seoDescription ?: translation.summary}]]*/ "Özet",
          "url": /*[[${baseUrl + '/' + language.code + '/topics/' + topic.slug}]]*/ "https://www.learnforgex.com",
          "inLanguage": /*[[${language.code}]]*/ "en",
          "learningResourceType": "Lesson",
          "educationalLevel": /*[[${topic.difficulty}]]*/ "BEGINNER",
          "isPartOf": {
            "@type": "Course",
            "name": /*[[${topic.category.course.name}]]*/ "Java"
          },
          "provider": {
            "@type": "Organization",
            "name": "LearnForgeX",
            "url": /*[[${baseUrl}]]*/ "https://www.learnforgex.com"
          }
        }
        </script>
    </th:block>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-lg-7 p-4">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/{lang}(lang=${language.code})}" th:text="#{breadcrumb.home}">Ana Sayfa</a>
                    </li>
                    <li class="breadcrumb-item" th:text="${categoryName}">Kategori</li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${contentAvailable} ? ${translation.title} : ${topic.slug}">Konu</li>
                </ol>
            </nav>

            <!-- Konu var ama bu dilde yayında değil: 404 yerine dostane bir mesaj.
                 unavailableMessage, TopicController'da MessageSource ile hazırlanıyor —
                 çünkü Türkçe/İngilizce cümle yapısı farklı ("X dilde ... değil" vs.
                 "... not available in X"), tek bir prefix+isim+suffix şablonu ikisine
                 birden uymuyor; bkz. topic.unavailable mesaj anahtarı. -->
            <div th:if="${!contentAvailable}" class="alert alert-warning">
                <p class="mb-2" th:text="${unavailableMessage}">Bu içerik bu dilde henüz mevcut değil.</p>
                <a th:if="${otherLanguageAvailable}"
                   class="btn btn-sm btn-warning"
                   th:href="@{/{lang}/topics/{slug}(lang=${otherLanguage.code}, slug=${topic.slug})}">
                    <span th:text="${otherLanguage.code == 'tr'} ? 'Türkçe olarak görüntüle' : 'View in English'"></span>
                </a>
            </div>

            <div th:if="${contentAvailable}">
                <div class="topic-header mb-3">
                    <div class="topic-header-info">
                        <h1 class="mb-1" th:text="${translation.title}">Başlık</h1>
                        <p class="text-muted mb-2" th:text="${translation.summary}">Özet</p>
                        <span class="badge text-bg-secondary" th:text="#{${'difficulty.' + topic.difficulty}}">Zorluk</span>
                        <span class="text-muted small ms-2"
                              th:if="${topic.estimatedMinutes != null}"
                              th:text="${topic.estimatedMinutes} + ' ' + #{time.minutesShort}">15 dk</span>

                        <!-- Faz 77: "PDF İndir" — kasıtlı olarak kendi satırında, EN/TR dil
                             butonunun YANINDA değil (topic-header zaten dar bir 2 sütunlu grid,
                             bkz. custom.css .topic-header). Yalnızca üstte, tek buton (kullanıcı
                             kararı) — dersin başında görünür olsun, ama sayfanın kalanına ek
                             bir CTA eklenmeden sade kalsın. -->
                        <div class="mt-2">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/{lang}/topics/{slug}/pdf(lang=${language.code}, slug=${topic.slug})}"
                               th:text="#{pdf.download}">↓ PDF İndir</a>
                        </div>
                    </div>
                    <a th:if="${otherLanguageAvailable}"
                       class="btn btn-sm btn-outline-secondary"
                       th:href="@{/{lang}/topics/{slug}(lang=${otherLanguage.code}, slug=${topic.slug})}"
                       th:text="${otherLanguage.code == 'tr'} ? 'TR' : 'EN'">Dil</a>
                </div>

                <!-- th:utext: contentHtml, CommonMark ile SUNUCUDA üretilen güvenilir/repo-kontrollü
                     Markdown'dan geliyor (kullanıcı girdisi değil). İleride bu içerik kullanıcıdan/
                     üçüncü taraftan gelmeye başlarsa, escape'siz basmadan önce mutlaka bir
                     HTML sanitizer (örn. OWASP Java HTML Sanitizer) araya girmeli. -->
                <article class="markdown-content" th:utext="${contentHtml}">
                    İçerik
                </article>

                <!-- Quiz: yalnızca bu konu/dilde aktif bir Quiz + sorusu varsa render
                     edilir -- bkz. QuizService.findQuiz/loadQuiz. Faz B'den itibaren
                     genellenmiş: submit URL'i topic+quiz slug'larından kuruluyor, artık
                     enum'a hardcode değil. is_correct/correctOptionIds/explanation bu
                     markup'ta HİÇBİR ZAMAN yer almaz, yalnızca submit response'unda
                     gelir (bkz. quiz.js). -->
                <section th:if="${quiz != null and quizQuestions != null and !#lists.isEmpty(quizQuestions)}"
                         id="quiz-section"
                         class="mt-5 pt-4 border-top"
                         th:data-submit-url="@{/{lang}/topics/{topicSlug}/quiz/{quizSlug}/submit(lang=${language.code}, topicSlug=${topic.slug}, quizSlug=${quiz.slug()})}"
                         th:data-msg-score="#{quiz.score}"
                         th:data-msg-passed="#{quiz.passed}"
                         th:data-msg-failed="#{quiz.failed}"
                         th:data-msg-error="#{quiz.error.generic}">

                    <h2 th:text="#{quiz.title}">Bilgini Test Et</h2>
                    <p class="text-muted" th:text="#{quiz.instructions}">Tüm soruları cevapla ve gönder.</p>

                    <form id="quiz-form">
                        <div class="quiz-question mb-4" th:each="q, qStat : ${quizQuestions}"
                             th:data-question-id="${q.id()}">
                            <p class="fw-semibold"
                               th:text="${qStat.count} + '. ' + ${q.question()}">Soru metni</p>
                            <!-- CODE_OUTPUT: kod snippet'i varsa highlight.js'in zaten sayfa
                                 altında çalıştırdığı hljs.highlightAll() ile aynı mekanizmayla
                                 vurgulanır (bkz. topic.html altındaki script) -- SINGLE_CHOICE/
                                 MULTIPLE_CHOICE'ta bu blok hiç render edilmez, codeSnippet zaten
                                 null. th:text kullanıldığı için kod metni her zaman escape'lenir. -->
                            <pre th:if="${q.type() != null and q.type().name() == 'CODE_OUTPUT' and q.codeSnippet() != null and !#strings.isEmpty(q.codeSnippet())}"
                                 class="mb-3"><code th:text="${q.codeSnippet()}"
                                      th:class="${'language-' + (q.codeLanguage() != null ? q.codeLanguage() : 'plaintext')}">code</code></pre>
                            <!-- MULTIPLE_CHOICE sorularda checkbox, diğer tiplerde (SINGLE_CHOICE/
                                 CODE_OUTPUT) radio -- th:type, statik type="radio" fallback'ini
                                 EZER. Aynı name'i checkbox'larda da korumak zararsız (radio'nun
                                 aksine checkbox'lar aynı name'i paylaşsa bile birbirinden bağımsız
                                 kalır) -- quiz.js zaten generic ':checked' sorgusu kullandığı için
                                 (bkz. collectAnswers/answeredQuestionCount) burada BAŞKA hiçbir
                                 değişiklik gerekmiyor. -->
                            <div class="form-check" th:each="opt : ${q.options()}">
                                <input class="form-check-input quiz-option-input" type="radio"
                                       th:type="${q.type() != null and q.type().name() == 'MULTIPLE_CHOICE'} ? 'checkbox' : 'radio'"
                                       th:name="'question-' + ${q.id()}"
                                       th:id="'quiz-option-' + ${opt.id()}"
                                       th:value="${opt.id()}"
                                       th:data-question-id="${q.id()}"/>
                                <label class="form-check-label" th:for="'quiz-option-' + ${opt.id()}"
                                       th:text="${opt.optionText()}">Seçenek</label>
                            </div>
                            <div class="quiz-result-feedback mt-2 small" style="display:none;"></div>
                        </div>

                        <button type="submit" id="quiz-submit-btn" class="btn btn-primary" disabled
                                th:text="#{quiz.submit}">Gönder</button>
                    </form>

                    <div id="quiz-summary" class="alert mt-3" style="display:none;" role="alert"></div>
                </section>

                <nav class="d-flex justify-content-between mt-5 pt-3 border-top" aria-label="Konu navigasyonu">
                    <a th:if="${previousTopic != null}"
                       class="btn btn-outline-secondary text-start"
                       th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${previousTopic.slug()})}">
                        <div class="small text-muted">&larr; <span th:text="#{nav.previous}">Önceki</span></div>
                        <div th:text="${previousTopic.title()}">Başlık</div>
                    </a>
                    <span th:unless="${previousTopic != null}"></span>

                    <a th:if="${nextTopic != null}"
                       class="btn btn-outline-secondary text-end ms-auto"
                       th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${nextTopic.slug()})}">
                        <div class="small text-muted"><span th:text="#{nav.next}">Sonraki</span> &rarr;</div>
                        <div th:text="${nextTopic.title()}">Başlık</div>
                    </a>
                </nav>
            </div>

        </main>

        <!-- Sağdaki "Bu sayfada" navigasyonu: sadece lg+ ekranlarda gösteriliyor (mobil/tablette
             yer yok, kullanıcı zaten doğal scroll ile ilerliyor). toc, MarkdownService'in
             render edilmiş HTML'den çıkardığı h2 id'lerinden geliyor (bkz. MarkdownService). -->
        <nav th:if="${contentAvailable and toc != null and !#lists.isEmpty(toc)}"
             class="d-none d-lg-block col-lg-3 p-4 sticky-top toc-sticky"
             aria-label="Sayfa içi navigasyon">
            <div class="text-uppercase text-muted small fw-bold mb-2" th:text="#{toc.onThisPage}">Bu sayfada</div>
            <ul class="nav flex-column small">
                <li class="nav-item" th:each="entry : ${toc}">
                    <a class="nav-link py-1 px-0" th:href="'#' + ${entry.id()}" th:text="${entry.text()}">Başlık</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
<script th:src="@{/js/quiz.js}"></script>

</body>
</html>
