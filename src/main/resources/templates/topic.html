<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${contentAvailable} ? (translation.seoTitle ?: translation.title) : topic.slug">Konu</title>
    <meta th:if="${contentAvailable and translation.seoDescription != null}"
          name="description" th:content="${translation.seoDescription}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-md-9 col-lg-10 p-4">

            <!-- Konu var ama bu dilde yayında değil: 404 yerine dostane bir mesaj.
                 unavailableMessage, TopicController'da MessageSource ile hazırlanıyor —
                 çünkü Türkçe/İngilizce cümle yapısı farklı ("X dilde ... değil" vs.
                 "... not available in X"), tek bir prefix+isim+suffix şablonu ikisine
                 birden uymuyor; bkz. topic.unavailable mesaj anahtarı. -->
            <div th:if="${!contentAvailable}" class="alert alert-warning">
                <p class="mb-2" th:text="${unavailableMessage}">Bu içerik bu dilde henüz mevcut değil.</p>
                <a th:if="${otherLanguageAvailable}"
                   class="btn btn-sm btn-warning"
                   th:href="@{/topics/{slug}(slug=${topic.slug}, lang=${otherLanguage.code})}">
                    <span th:text="${otherLanguage.code == 'tr'} ? 'Türkçe olarak görüntüle' : 'View in English'"></span>
                </a>
            </div>

            <div th:if="${contentAvailable}">
                <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
                    <div>
                        <h1 class="mb-1" th:text="${translation.title}">Başlık</h1>
                        <p class="text-muted mb-2" th:text="${translation.summary}">Özet</p>
                        <span class="badge text-bg-secondary" th:text="#{${'difficulty.' + topic.difficulty}}">Zorluk</span>
                        <span class="text-muted small ms-2"
                              th:if="${topic.estimatedMinutes != null}"
                              th:text="${topic.estimatedMinutes} + ' ' + #{time.minutesShort}">15 dk</span>
                    </div>
                    <a th:if="${otherLanguageAvailable}"
                       class="btn btn-sm btn-outline-secondary"
                       th:href="@{/topics/{slug}(slug=${topic.slug}, lang=${otherLanguage.code})}"
                       th:text="${otherLanguage.code == 'tr'} ? 'TR' : 'EN'">Dil</a>
                </div>

                <!-- th:utext: contentHtml, CommonMark ile SUNUCUDA üretilen güvenilir/repo-kontrollü
                     Markdown'dan geliyor (kullanıcı girdisi değil). İleride bu içerik kullanıcıdan/
                     üçüncü taraftan gelmeye başlarsa, escape'siz basmadan önce mutlaka bir
                     HTML sanitizer (örn. OWASP Java HTML Sanitizer) araya girmeli. -->
                <article class="markdown-content" th:utext="${contentHtml}">
                    İçerik
                </article>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>hljs.highlightAll();</script>

</body>
</html>
