<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Page not found | LearnForgeX</title>
    <meta name="robots" content="noindex"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>
<!-- Hata sayfası Spring'in /error dispatch'iyle render edilir: bu noktada istenen dil
     URL'den güvenilir biçimde okunamadığı ve layout fragment'lerinin beklediği model
     (language, nav) bulunmadığı için sayfa BİLİNÇLİ OLARAK bağımsız ve iki dilli. -->
<main class="container py-5 text-center">
    <a href="/en"><img th:src="@{/img/logo.svg}" alt="LearnForgeX" height="48" class="mb-4"/></a>
    <p class="display-4 fw-bold mb-3">404</p>
    <h1 class="h4">Page not found</h1>
    <p class="text-muted">The page you are looking for does not exist or has moved.</p>
    <p><a class="btn btn-primary" href="/en">Browse all lessons</a></p>
    <hr class="my-4 mx-auto" style="max-width: 20rem"/>
    <h2 class="h4">Sayfa bulunamadı</h2>
    <p class="text-muted">Aradığınız sayfa mevcut değil ya da taşınmış.</p>
    <p><a class="btn btn-outline-primary" href="/tr">Tüm derslere göz at</a></p>
</main>
</body>
</html>
