<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'LearnForgeX — ' + #{aiTutor.title}">AI Tutor</title>
    <!-- Kimlik doğrulanmış/ADMIN-only bir araç -- public içerik değil, indexlenmemeli. -->
    <meta name="robots" content="noindex, nofollow"/>
    <!-- ai-tutor.js POST/DELETE isteklerinde bu token'ı başlık olarak gönderir (CSRF açık). -->
    <meta th:if="${tutorAvailable and _csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${tutorAvailable and _csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<!-- question-review.html ile aynı: yalnızca navbar + footer, public sidebar yok. -->
<div th:replace="~{fragments/layout :: navbar(hideMenuToggle=true)}"></div>

<div class="container py-4 ai-tutor-page">
    <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-1">
        <h1 class="mb-0" th:text="#{aiTutor.title}">AI Tutor</h1>
        <!-- Dil path'tedir: diğer dilin aynı sayfasına geçiş (seçili ders korunur, sohbet yeniden başlar). -->
        <a class="small" th:lang="${language.other().code}"
           th:href="${tutorTopic != null}
                ? @{/{lang}/admin/ai-tutor(lang=${language.other().code}, topic=${tutorTopic.slug()})}
                : @{/{lang}/admin/ai-tutor(lang=${language.other().code})}"
           th:text="#{aiTutor.language.switch}">Türkçe</a>
    </div>
    <p class="text-muted" th:text="#{aiTutor.intro}">Ask programming questions.</p>

    <div th:unless="${tutorAvailable}" class="alert alert-secondary" role="status"
         th:text="#{aiTutor.unavailable}">The AI Tutor is currently turned off.</div>

    <th:block th:if="${tutorAvailable}">
        <form class="row g-2 align-items-end mb-3" method="get"
              th:action="@{/{lang}/admin/ai-tutor(lang=${language.code})}">
            <div class="col-12 col-md-8">
                <label for="ai-tutor-topic" class="form-label fw-semibold" th:text="#{aiTutor.lesson.label}">Lesson</label>
                <select id="ai-tutor-topic" name="topic" class="form-select" aria-describedby="ai-tutor-topic-help">
                    <option value="" th:text="#{aiTutor.lesson.none}">No lesson</option>
                    <optgroup th:each="course : ${tutorCourses}" th:label="${course.name()}">
                        <th:block th:each="category : ${course.categories()}">
                            <option th:each="topicItem : ${category.topics()}"
                                    th:value="${topicItem.slug()}"
                                    th:selected="${tutorTopic != null and tutorTopic.slug() == topicItem.slug()}"
                                    th:text="${category.name() + ' — ' + topicItem.title()}">Topic</option>
                        </th:block>
                    </optgroup>
                </select>
                <div id="ai-tutor-topic-help" class="form-text" th:text="#{aiTutor.lesson.help}">
                    Choosing a lesson starts a new conversation.
                </div>
            </div>
            <div class="col-12 col-md-4">
                <button type="submit" class="btn btn-outline-primary w-100" th:text="#{aiTutor.lesson.apply}">Use lesson</button>
            </div>
        </form>

        <div th:if="${tutorTopicNotFound}" class="alert alert-warning" role="alert"
             th:text="#{aiTutor.lesson.notFound}">Lesson not found.</div>
        <p th:if="${tutorTopic != null}" class="mb-3">
            <span class="badge text-bg-info text-wrap text-start"
                  th:text="#{aiTutor.lesson.using(${tutorTopic.title()})}">Using lesson: Enum</span>
        </p>

        <div th:replace="~{fragments/ai-tutor :: chat(
                messagesUrl=@{/{lang}/admin/ai-tutor/messages(lang=${language.code})},
                conversationsUrl=@{/{lang}/admin/ai-tutor/conversations(lang=${language.code})},
                topicSlug=${tutorTopic != null ? tutorTopic.slug() : null})}"></div>
    </th:block>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:if="${tutorAvailable}">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/languages/dockerfile.min.js"></script>
    <script th:src="@{/js/ai-tutor.js}"></script>
</th:block>

</body>
</html>
