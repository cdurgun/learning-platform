<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* AI Tutor sohbet bileşeni (plan §8). Ayrı yönetici sayfası kullanır; adım 11'de ders sayfasının
     paneli de aynı parçayı kullanacak. Yalnızca ADMIN ve tutor açıkken render edilmelidir.

     Parametreler:
       messagesUrl / conversationsUrl : AiTutorController'ın uç noktaları (dil path'te)
       topicSlug                      : ders bağlamı; yoksa null (genel sorular)

     Güvenlik sözleşmesi (static/js/ai-tutor.js):
       - kullanıcı mesajı ve sunucunun hata metni YALNIZCA textContent ile basılır;
       - DOM'a HTML olarak yalnızca yanıtın answerHtml alanı girer (sunucuda TutorAnswerRenderer
         ile temizlenmiş), o da tarayıcıda aynı izin listesinden bir kez daha geçirilir;
       - CSRF token'ı sayfanın <meta name="_csrf"> / <meta name="_csrf_header"> etiketlerinden
         okunup başlık olarak gönderilir.
     Arayüz metinleri data-msg-* özniteliklerinde (quiz.js ile aynı desen). */-->
<section th:fragment="chat(messagesUrl, conversationsUrl, topicSlug)"
         class="ai-tutor card"
         th:attr="data-messages-url=${messagesUrl},
                  data-conversations-url=${conversationsUrl},
                  data-topic-slug=${topicSlug},
                  data-msg-you=#{aiTutor.you},
                  data-msg-tutor=#{aiTutor.tutor},
                  data-msg-not-saved=#{aiTutor.notSaved},
                  data-msg-conversation-lost=#{aiTutor.conversationLost},
                  data-msg-truncated=#{aiTutor.truncated},
                  data-msg-turns-remaining=#{aiTutor.turnsRemaining},
                  data-msg-turns-exhausted=#{aiTutor.turnsExhausted},
                  data-msg-deleted=#{aiTutor.deleted},
                  data-msg-unanswered=#{aiTutor.unanswered},
                  data-msg-network=#{aiTutor.client.network},
                  data-msg-client-timeout=#{aiTutor.client.timeout},
                  data-msg-session-expired=#{aiTutor.client.sessionExpired},
                  data-msg-not-allowed=#{aiTutor.client.notAllowed},
                  data-msg-generic=#{aiTutor.client.generic}">
    <div class="card-body d-flex flex-column gap-3">
        <div class="ai-tutor-messages" role="log" aria-live="polite" aria-relevant="additions"
             th:aria-label="#{aiTutor.history}" tabindex="0">
            <p class="ai-tutor-empty text-muted mb-0" th:text="#{aiTutor.empty}">No messages yet.</p>
        </div>

        <div class="ai-tutor-alert alert alert-warning mb-0 d-none" role="alert"></div>

        <p class="ai-tutor-note small text-muted mb-0 d-none"></p>

        <form class="ai-tutor-form" novalidate>
            <label class="form-label fw-semibold" th:for="${'ai-tutor-input'}"
                   th:text="#{aiTutor.message.label}">Your question</label>
            <textarea id="ai-tutor-input" class="form-control ai-tutor-input" rows="3" maxlength="4000"
                      th:placeholder="#{aiTutor.message.placeholder}"
                      aria-describedby="ai-tutor-input-help"></textarea>
            <div id="ai-tutor-input-help" class="form-text" th:text="#{aiTutor.message.help}">
                Enter sends, Shift+Enter adds a new line.
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                <button type="submit" class="btn btn-primary ai-tutor-send">
                    <span class="spinner-border spinner-border-sm me-1 d-none ai-tutor-spinner" aria-hidden="true"></span>
                    <span th:text="#{aiTutor.send}">Send</span>
                </button>
                <button type="button" class="btn btn-outline-secondary ai-tutor-new"
                        th:text="#{aiTutor.newConversation}">New conversation</button>
                <button type="button" class="btn btn-outline-danger ai-tutor-delete" disabled
                        th:text="#{aiTutor.deleteConversation}">Delete conversation</button>
                <span class="ai-tutor-status small text-muted" role="status" aria-live="polite"
                      th:attr="data-busy-text=#{aiTutor.sending}"></span>
            </div>
        </form>
    </div>
</section>

</body>
</html>
