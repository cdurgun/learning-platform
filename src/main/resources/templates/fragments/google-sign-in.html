<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- "Google ile devam et" butonu (login + register). Google'ın marka kurallarındaki açık
     tema: beyaz zemin, gri çerçeve, çok renkli "G". Düz bir bağlantı -- Google'ın
     JavaScript kütüphanesi YÜKLENMEZ, akış tamamen sunucu tarafında (bkz.
     GoogleSignInController). Tıklanınca js/google-sign-in.js yükleniyor durumunu gösterir.
     Yalnızca Google istemcisi yapılandırılmışsa çizilir. -->
<th:block th:fragment="button">
    <th:block th:if="${googleSignInEnabled}">
        <a class="btn btn-google w-100" data-google-sign-in
           th:href="@{/{lang}/login/google(lang=${language.code})}"
           th:attr="data-loading-text=#{auth.google.redirecting}">
            <svg class="btn-google-logo" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            <span data-google-sign-in-label th:text="#{auth.google.continue}">Continue with Google</span>
        </a>

        <div class="auth-divider" role="separator">
            <span th:text="#{auth.google.or}">or</span>
        </div>

        <script defer th:src="@{/js/google-sign-in.js}"></script>
    </th:block>
</th:block>

</body>
</html>
