<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- Bu dosya doğrudan render edilmez; yalnızca aşağıdaki fragment'leri barındırır. -->
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <button class="navbar-toggler d-lg-none me-2" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas"
            aria-controls="sidebarOffcanvas" th:aria-label="#{nav.toggleMenu}">
        <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/{lang}(lang=${language.code})}">
        <img th:src="@{/img/favicon.svg(v=2)}" alt="" width="30" height="30"/>
        <span class="d-flex flex-column lh-1">
            <span>Learn<span class="brand-accent">Forge</span>X</span>
            <small class="navbar-tagline">Forge your skills</small>
        </span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <div th:if="${currentUserDisplayName == null}">
            <a class="btn btn-sm btn-outline-light"
               th:href="@{/{lang}/login(lang=${language != null ? language.code : 'en'})}"
               th:text="#{auth.signIn}">Sign in</a>
        </div>
        <div th:if="${currentUserDisplayName != null}" class="d-flex align-items-center gap-2">
            <span class="text-light small" th:text="${currentUserDisplayName}">User Name</span>
            <form class="d-inline" method="post"
                  th:action="@{/{lang}/logout(lang=${language != null ? language.code : 'en'})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-light" th:text="#{auth.logout}">Logout</button>
            </form>
        </div>
        <a class="btn btn-sm btn-outline-light"
           th:classappend="${language != null and language.code == 'tr'} ? 'active' : ''"
           th:href="@{/tr}">TR</a>
        <a class="btn btn-sm btn-outline-light"
           th:classappend="${language != null and language.code == 'en'} ? 'active' : ''"
           th:href="@{/en}">EN</a>
    </div>
</nav>

<aside th:fragment="sidebar" id="sidebarOffcanvas" class="offcanvas-lg offcanvas-start col-lg-2 bg-light border-end sidebar-nav"
       tabindex="-1" aria-labelledby="sidebarOffcanvasLabel">
    <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title" id="sidebarOffcanvasLabel" th:text="#{nav.menu}">Menü</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas"
                th:aria-label="#{nav.close}"></button>
    </div>
    <div class="offcanvas-body p-3 d-block">
        <div th:each="course : ${nav}" class="mb-4">
            <h6 class="text-uppercase text-muted small fw-bold" th:text="${course.name()}">Kurs</h6>
            <div th:each="category : ${course.categories()}"
                 th:with="categoryId=${'cat-' + course.slug() + '-' + category.slug()},
                          categoryIsActive=${activeTopicSlug != null and !category.topics().?[#this.slug() == #vars.activeTopicSlug].isEmpty()}"
                 class="mb-1">
                <button class="sidebar-toggle btn btn-sm d-flex align-items-center justify-content-between w-100 px-2 py-1 fw-semibold small text-start border-0 bg-transparent"
                        type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#' + ${categoryId}"
                        th:aria-expanded="${categoryIsActive}"
                        th:aria-controls="${categoryId}">
                    <span th:text="${category.name()}">Kategori</span>
                    <span class="chevron" aria-hidden="true">&rsaquo;</span>
                </button>
                <div class="collapse" th:classappend="${categoryIsActive} ? 'show' : ''" th:id="${categoryId}">
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item" th:each="topicItem : ${category.topics()}">
                            <a class="nav-link py-1 px-2"
                               th:classappend="${activeTopicSlug != null and activeTopicSlug == topicItem.slug()} ? 'fw-bold text-primary' : ''"
                               th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${topicItem.slug()})}"
                               th:text="${topicItem.title()}">Konu</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(nav)}" class="text-muted small" th:text="#{nav.noContent}">Henüz yayınlanmış içerik yok.</p>

        <!-- Quiz Area: course/category navigasyonundan BAĞIMSIZ, ayrı bir kaynaktan
             (QuizDefinition, bkz. QuizNavigationService) beslenen ayrı bir bölüm,
             yukarıdaki course ağacıyla AYNI toggle/chevron/collapse deseni kullanılır. -->
        <div th:if="${!#lists.isEmpty(quizNav) or isAdmin}" class="mb-4">
            <h6 class="text-uppercase text-muted small fw-bold" th:text="#{nav.quiz}">QUIZ</h6>
            <div th:each="group : ${quizNav}" th:with="groupId=${'quiz-' + group.groupSlug()}" class="mb-1">
                <button class="sidebar-toggle btn btn-sm d-flex align-items-center justify-content-between w-100 px-2 py-1 fw-semibold small text-start border-0 bg-transparent"
                        type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#' + ${groupId}"
                        th:aria-controls="${groupId}">
                    <span th:text="${group.groupLabel()}">Java Quiz</span>
                    <span class="chevron" aria-hidden="true">&rsaquo;</span>
                </button>
                <div class="collapse" th:id="${groupId}">
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item" th:each="def : ${group.definitions()}">
                            <a class="nav-link py-1 px-2"
                               th:href="@{/{lang}/quiz/{slug}(lang=${language.code}, slug=${def.slug()})}"
                               th:text="${def.title()}">Basic Java</a>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- ADMIN-only: yalnızca sidebar'da gizlenmesi yeterli DEĞİL -- gerçek erişim
                 kontrolü SecurityConfig'teki `/{lang:en|tr}/admin/**` -> hasRole("ADMIN")
                 kuralı (Faz 141) tarafından zaten sağlanıyor, bu yalnızca o kararın
                 UI'daki yansıması. -->
            <ul class="nav flex-column mb-1" th:if="${isAdmin}">
                <li class="nav-item">
                    <a class="nav-link py-1 px-2"
                       th:href="@{/{lang}/admin/questions(lang=${language.code})}"
                       th:text="#{admin.questions.title}">Question Review</a>
                </li>
            </ul>
        </div>
    </div>
</aside>

<footer th:fragment="footer" class="border-top mt-5 py-3 text-center text-muted small">
    <span>&copy; 2026 Learn<span class="brand-accent">Forge</span>X</span>
</footer>

</body>
</html>
