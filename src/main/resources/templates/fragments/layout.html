<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- Bu dosya doğrudan render edilmez; yalnızca aşağıdaki fragment'leri barındırır. -->
</head>
<body>

<!--/* Sosyal medya linkleri (YouTube/Instagram). Navbar'da yalnızca md ve üstünde, footer'da
     her ekran boyutunda kullanılır; ikonlar inline SVG (ek bağımlılık yok), renkler custom.css'te. */-->
<div th:fragment="social(extraClass)" th:class="'social-links d-flex align-items-center ' + ${extraClass}">
    <a class="social-link social-youtube" href="https://www.youtube.com/@LearnForgeXAcademy"
       target="_blank" rel="noopener noreferrer"
       th:aria-label="#{social.youtube}" th:title="#{social.youtube}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>
    </a>
    <a class="social-link social-instagram" href="https://www.instagram.com/learnforgex/"
       target="_blank" rel="noopener noreferrer"
       th:aria-label="#{social.instagram}" th:title="#{social.instagram}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7C8.3 24 8.7 24 12 24s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>
    </a>
</div>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-3 sticky-top">
    <button th:unless="${hideMenuToggle}" class="navbar-toggler d-lg-none me-2" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas"
            aria-controls="sidebarOffcanvas" th:aria-label="#{nav.toggleMenu}">
        <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/{lang}(lang=${language.code})}">
        <img th:src="@{/img/favicon.svg(v=2)}" alt="" width="30" height="30"/>
        <span class="d-flex flex-column lh-1">
            <span>Learn<span class="brand-accent">Forge</span>X</span>
            <small class="navbar-tagline">Forge your skills</small>
        </span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
        <div class="d-none d-md-flex align-items-center gap-2">
            <div th:replace="~{fragments/layout :: social('')}"></div>
            <span class="navbar-divider" aria-hidden="true"></span>
        </div>
        <!--/* md altında navbar tek satıra sığsın diye (custom.css "Navbar: md altı kompakt"):
             Sign in/Logout yalnızca ikon (metin ekran okuyucular için kalır), kullanıcı adı
             gizlenir, dil butonlarından yalnızca DİĞER dile geçen gösterilir. */-->
        <div th:if="${currentUserDisplayName == null}">
            <a class="btn btn-sm btn-outline-light navbar-action"
               th:href="@{/{lang}/login(lang=${language != null ? language.code : 'en'})}"
               th:title="#{auth.signIn}">
                <svg class="d-md-none" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
                <span class="navbar-action-label" th:text="#{auth.signIn}">Sign in</span>
            </a>
        </div>
        <div th:if="${currentUserDisplayName != null}" class="d-flex align-items-center gap-2">
            <span class="text-light small text-truncate navbar-user-name d-none d-md-block" th:title="${currentUserDisplayName}"
                  th:text="${currentUserDisplayName}">User Name</span>
            <form class="d-inline" method="post"
                  th:action="@{/{lang}/logout(lang=${language != null ? language.code : 'en'})}">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-light navbar-action"
                        th:title="${currentUserDisplayName + ' · ' + #messages.msg('auth.logout')}">
                    <svg class="d-md-none" viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
                    <span class="navbar-action-label" th:text="#{auth.logout}">Logout</span>
                </button>
            </form>
        </div>
        <a class="btn btn-sm btn-outline-light"
           th:classappend="${language != null and language.code == 'tr'} ? 'active d-none d-md-inline-block' : ''"
           th:href="@{/tr}">TR</a>
        <a class="btn btn-sm btn-outline-light"
           th:classappend="${language != null and language.code == 'en'} ? 'active d-none d-md-inline-block' : ''"
           th:href="@{/en}">EN</a>
    </div>
</nav>

<aside th:fragment="sidebar" id="sidebarOffcanvas" class="offcanvas-lg offcanvas-start col-lg-2 bg-light border-end sidebar-nav"
       tabindex="-1" aria-labelledby="sidebarOffcanvasLabel">
    <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title" id="sidebarOffcanvasLabel" th:text="#{nav.menu}">Menü</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas"
                th:aria-label="#{nav.close}"></button>
    </div>
    <div class="offcanvas-body p-3 d-block">
        <div th:each="course : ${nav}" class="mb-4">
            <h6 class="text-uppercase small fw-bold">
                <a class="text-muted text-decoration-none"
                   th:href="@{/{lang}/courses/{slug}(lang=${language.code}, slug=${course.slug()})}"
                   th:text="${course.name()}">Kurs</a>
            </h6>
            <div th:each="category : ${course.categories()}"
                 th:with="categoryId=${'cat-' + course.slug() + '-' + category.slug()},
                          categoryIsActive=${activeTopicSlug != null and !category.topics().?[#this.slug() == #vars.activeTopicSlug].isEmpty()}"
                 class="mb-1">
                <button class="sidebar-toggle btn btn-sm d-flex align-items-center justify-content-between w-100 px-2 py-1 fw-semibold small text-start border-0 bg-transparent"
                        type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#' + ${categoryId}"
                        th:aria-expanded="${categoryIsActive}"
                        th:aria-controls="${categoryId}">
                    <span th:text="${category.name()}">Kategori</span>
                    <span class="chevron" aria-hidden="true">&rsaquo;</span>
                </button>
                <div class="collapse" th:classappend="${categoryIsActive} ? 'show' : ''" th:id="${categoryId}">
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item" th:each="topicItem : ${category.topics()}">
                            <a class="nav-link py-1 px-2"
                               th:classappend="${activeTopicSlug != null and activeTopicSlug == topicItem.slug()} ? 'fw-bold text-primary' : ''"
                               th:href="@{/{lang}/topics/{slug}(lang=${language.code}, slug=${topicItem.slug()})}"
                               th:text="${topicItem.title()}">Konu</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(nav)}" class="text-muted small" th:text="#{nav.noContent}">Henüz yayınlanmış içerik yok.</p>

        <!-- Quiz Area: course/category navigasyonundan BAĞIMSIZ, ayrı bir kaynaktan
             (QuizDefinition, bkz. QuizNavigationService) beslenen ayrı bir bölüm,
             yukarıdaki course ağacıyla AYNI toggle/chevron/collapse deseni kullanılır. -->
        <div th:if="${!#lists.isEmpty(quizNav) or isAdmin}" class="mb-4">
            <h6 class="text-uppercase text-muted small fw-bold" th:text="#{nav.quiz}">QUIZ</h6>
            <div th:each="group : ${quizNav}" th:with="groupId=${'quiz-' + group.groupSlug()}, locked=${!group.accessible()}"
                 class="mb-1" th:classappend="${locked} ? 'opacity-50' : ''">
                <button class="sidebar-toggle btn btn-sm d-flex align-items-center justify-content-between w-100 px-2 py-1 fw-semibold small text-start border-0 bg-transparent"
                        type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#' + ${groupId}"
                        th:aria-controls="${groupId}"
                        th:disabled="${locked}">
                    <span th:text="${group.groupLabel()}">Java Quiz</span>
                    <span class="chevron" aria-hidden="true">&rsaquo;</span>
                </button>
                <div class="collapse" th:id="${groupId}">
                    <ul class="nav flex-column mb-2">
                        <li class="nav-item" th:each="def : ${group.definitions()}">
                            <a th:unless="${locked}" class="nav-link py-1 px-2"
                               th:href="@{/{lang}/quiz/{slug}(lang=${language.code}, slug=${def.slug()})}"
                               th:text="${def.title()}">Basic Java</a>
                            <span th:if="${locked}" class="nav-link disabled py-1 px-2" aria-disabled="true"
                                  th:text="${def.title()}">Basic Java</span>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- ADMIN-only: yalnızca sidebar'da gizlenmesi yeterli DEĞİL -- gerçek erişim
                 kontrolü SecurityConfig'teki `/{lang:en|tr}/admin/**` -> hasRole("ADMIN")
                 kuralı (Faz 141) tarafından zaten sağlanıyor, bu yalnızca o kararın
                 UI'daki yansıması. -->
            <ul class="nav flex-column mb-1" th:if="${isAdmin}">
                <li class="nav-item">
                    <a class="nav-link py-1 px-2"
                       th:href="@{/{lang}/admin/questions(lang=${language.code})}"
                       th:text="#{admin.questions.title}">Question Review</a>
                </li>
            </ul>
        </div>
    </div>
</aside>

<!--/* Sayfa altı. Çerez onayı banner'ı da burada: footer'ı kullanan her şablon onu
     otomatik alır. Banner ve "Çerez ayarları" linki yalnızca `consentEnabled` true iken
     render edilir (bkz. GlobalModelAttributes#consentEnabled) -- analitik eklenene kadar
     kapalıdır, yani sayfada ne banner ne de consent.js bulunur. */-->
<th:block th:fragment="footer" th:with="footerLang=${language != null ? language.code : 'en'}">
<footer class="border-top mt-5 py-3 text-center text-muted small">
    <nav class="mb-1">
        <a class="link-secondary mx-2" th:href="@{/{lang}/about(lang=${footerLang})}" th:text="#{page.about.title}">About</a>
        <a class="link-secondary mx-2" th:href="@{/{lang}/contact(lang=${footerLang})}" th:text="#{page.contact.title}">Contact</a>
        <a class="link-secondary mx-2" th:href="@{/{lang}/privacy(lang=${footerLang})}" th:text="#{page.privacy.title}">Privacy Policy</a>
        <a class="link-secondary mx-2" th:href="@{/{lang}/terms(lang=${footerLang})}" th:text="#{page.terms.title}">Terms of Use</a>
        <button th:if="${consentEnabled}" type="button" class="btn btn-link link-secondary cookie-consent-link mx-2"
                data-consent-open th:text="#{consent.settingsLink}">Cookie settings</button>
    </nav>
    <div th:replace="~{fragments/layout :: social('justify-content-center mb-2')}"></div>
    <span>&copy; 2026 Learn<span class="brand-accent">Forge</span>X</span>
</footer>

<th:block th:if="${consentEnabled}">
    <div id="cookie-consent" class="cookie-consent" role="region" tabindex="-1" data-nosnippet hidden
         th:aria-label="#{consent.title}">
        <p class="cookie-consent-title" th:text="#{consent.title}">Cookies</p>
        <p class="cookie-consent-text">
            <span th:text="#{consent.description}">Description</span>
            <a th:href="@{/{lang}/privacy(lang=${footerLang})}" th:text="#{page.privacy.title}">Privacy Policy</a>
        </p>
        <div class="cookie-consent-settings" data-consent-settings hidden>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cookie-consent-required" checked disabled/>
                <label class="form-check-label" for="cookie-consent-required">
                    <strong th:text="#{consent.required}">Required</strong>
                    <span th:text="#{consent.requiredNote}">Always active</span>
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cookie-consent-analytics" data-consent-analytics/>
                <label class="form-check-label" for="cookie-consent-analytics">
                    <strong th:text="#{consent.analytics}">Analytics</strong>
                    <span th:text="#{consent.analyticsNote}">Helps understand how the site is used</span>
                </label>
            </div>
        </div>
        <div class="cookie-consent-actions">
            <button type="button" class="btn btn-sm btn-link link-secondary" data-consent-action="settings"
                    th:text="#{consent.settings}">Settings</button>
            <button type="button" class="btn btn-sm btn-outline-dark" data-consent-action="save" hidden
                    th:text="#{consent.save}">Save preferences</button>
            <button type="button" class="btn btn-sm btn-dark" data-consent-action="reject"
                    th:text="#{consent.reject}">Reject</button>
            <button type="button" class="btn btn-sm btn-dark" data-consent-action="accept"
                    th:text="#{consent.accept}">Accept</button>
        </div>
    </div>
    <script defer th:src="@{/js/consent.js}"></script>
</th:block>
</th:block>

</body>
</html>
