<!DOCTYPE html>
<html th:lang="${language.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{quiz.index.title} + ' | LearnForgeX'">Quizzes</title>
    <meta name="robots" content="noindex, follow"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg(v=2)}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon-32.png(v=2)}"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon-16.png(v=2)}"/>
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png(v=2)}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar}"></div>

        <main class="col-12 col-lg-9 p-4">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/{lang}(lang=${language.code})}" th:text="#{breadcrumb.home}">Home</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="#{quiz.index.title}">Quizzes</li>
                </ol>
            </nav>

            <h1 class="mb-1" th:text="#{quiz.index.title}">Quizzes</h1>
            <p class="text-muted mb-4" th:text="#{quiz.index.instructions}">Pick a scope to start a quiz.</p>

            <!-- quizNav, GlobalModelAttributes tarafından HER sayfaya sitewide enjekte
                 edilir (bkz. QuizNavigationService, Faz 139) -- bu sayfa ayrıca bir
                 controller sorgusuna ihtiyaç duymaz, sidebar'dakiyle AYNI listeyi kullanır. -->
            <div th:if="${#lists.isEmpty(quizNav)}" class="alert alert-info" th:text="#{quiz.index.empty}">
                No quizzes are available yet.
            </div>

            <div th:each="group : ${quizNav}" class="mb-4">
                <h2 class="h5" th:text="${group.groupLabel()}">Java Quiz</h2>
                <div class="d-flex flex-wrap gap-2">
                    <a th:each="def : ${group.definitions()}"
                       class="btn btn-outline-primary"
                       th:href="@{/{lang}/quiz/{slug}(lang=${language.code}, slug=${def.slug()})}"
                       th:text="${def.title()}">Basic Java</a>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
