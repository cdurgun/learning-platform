course.react.description=React'i JSX ve component'lerden hook'lara, routing'e, state yönetimine, test ve deployment'a kadar öğren; basit örnekler ve pratik projelerle.
course.ai.description=Geliştiriciler için yapay zeka: makine öğrenmesi temelleri, büyük dil modelleri, MCP, AI agent'lar ve Claude Code ile yapay zeka destekli geliştirme.
course.postgresql.description=PostgreSQL ve SQL öğren: veri tipleri, kısıtlar, JOIN'ler, gruplama, window fonksiyonları, EXPLAIN ile index'ler, transaction'lar ve eşzamanlılık.
course.git-github.description=Git ve GitHub öğren: commit'ler, branch'ler ve merge, pull request'ler, rebase, merge conflict'ler, stash ve pratik bir ekip iş akışı.
course.docker.description=Java geliştiricileri için Docker: image'lar ve Dockerfile'lar, ağ, volume'lar, Docker Compose ve production'a hazır Spring Boot container'ları.

