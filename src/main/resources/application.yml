spring:
  application:
    name: learning-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.cdurgun.learning: DEBUG
