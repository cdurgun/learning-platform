spring:
  application:
    name: learning-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Şema+host içeren mutlak URL üretmek gereken yerlerde (hreflang, canonical,
# Open Graph/Twitter meta, JSON-LD, sitemap.xml) kullanılır -- bkz. Faz 65 notu.
# Sonda "/" YOK, template'ler ve SitemapController hep kendi "/" ön ekini ekliyor.
# `application-prod.yml` production değerini (https://www.learnforgex.com) eziyor.
app:
  base-url: http://localhost:8080

# Faz D: AI/n8n'in soru havuzuna yazdığı /api/internal/questions/ingest rotasını
# korur (bkz. QuizIngestApiKeyInterceptor). Ortam değişkeni verilmezse BOŞ kalır
# -- interceptor boş bir anahtarla "her isteği kabul et"e DEĞİL, tüm istekleri
# REDDETMEYE düşer (fail-closed), bu yüzden dev/prod'da unutulması sessizce
# güvenlik açığı yaratmaz, yalnızca ingestion'ı devre dışı bırakır.
quiz:
  ingest:
    api-key: ${QUIZ_INGEST_API_KEY:}

logging:
  level:
    com.cdurgun.learning: DEBUG
