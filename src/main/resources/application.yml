spring:
  application:
    name: learning-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
    # Bu proje Flyway placeholder mekanizmasını (${...}) hiçbir migration'da
    # KASITLI OLARAK kullanmıyor (bkz. CLAUDE.md "Migration dosyalarında
    # literal ${...} yazma" kuralı). spring-mvc-views-thymeleaf konusunun
    # quiz soruları, dersin kendi konusu gereği gerçek Thymeleaf `${...}`
    # sözdizimini soru metni/code_snippet içinde göstermek ZORUNDA -- bu
    # ayar olmadan Flyway bunu bir placeholder sanıp "No value provided for
    # placeholder: ${topic.title}" hatasıyla TÜM uygulamanın başlamasını
    # engelliyor (question-promotion/V699'da GERÇEKTEN doğrulandı).
    # placeholder-replacement: false, bu mekanizmayı proje genelinde
    # devre dışı bırakır -- hiçbir mevcut migration ona bağımlı olmadığı
    # için güvenli, geriye dönük uyumlu bir değişiklik.

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/css,text/plain,text/xml,application/xml,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# Şema+host içeren mutlak URL üretmek gereken yerlerde (hreflang, canonical,
# Open Graph/Twitter meta, JSON-LD, sitemap.xml) kullanılır -- bkz. Faz 65 notu.
# Sonda "/" YOK, template'ler ve SitemapController hep kendi "/" ön ekini ekliyor.
# `application-prod.yml` production değerini (https://www.learnforgex.com) eziyor.
app:
  base-url: http://localhost:8080
  # Statik dosyaların hash'li adres çözümlemesi bellekte tutulsun mu (bkz. WebConfig).
  # Dev'de kapalı: bir CSS/JS dosyası değişince yeniden başlatmadan yeni hash üretilsin.
  cache-static-resource-chain: false
  # "Google ile devam et" (bkz. GoogleSignInConfig). İkisi de yalnızca ortam
  # değişkeninden okunur, repoya ASLA yazılmaz. GOOGLE_CLIENT_ID verilmezse Google
  # girişi tamamen kapalıdır (buton görünmez), şifreyle giriş aynen çalışır.
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

# Faz D: AI/n8n'in soru havuzuna yazdığı /api/internal/questions/ingest rotasını
# korur (bkz. QuizIngestApiKeyInterceptor). Ortam değişkeni verilmezse BOŞ kalır
# -- interceptor boş bir anahtarla "her isteği kabul et"e DEĞİL, tüm istekleri
# REDDETMEYE düşer (fail-closed), bu yüzden dev/prod'da unutulması sessizce
# güvenlik açığı yaratmaz, yalnızca ingestion'ı devre dışı bırakır.
quiz:
  ingest:
    api-key: ${QUIZ_INGEST_API_KEY:}
  # AI Judge otomatik yayınlama kill switch'i (bkz. QuestionReviewService#autoPublish).
  # Varsayılan olarak DEVRE DIŞI -- /api/internal/questions/{id}/auto-publish, bu
  # bayrak açıkça "true"ya ayarlanmadıkça 503 döner. Aynı X-Api-Key ile korunur
  # (bkz. QuizIngestApiKeyInterceptor), bu ayrı bir kimlik doğrulama DEĞİL, ikinci
  # bir bilinçli açma/kapama anahtarı.
  auto-publish:
    enabled: ${QUIZ_AUTO_PUBLISH_ENABLED:false}

# DeepSeek AI Tutor (bkz. AiTutorProperties, docs/deepseek-ai-tutor-plan.md). Varsayılan
# KAPALI: yalnızca AI_TUTOR_ENABLED=true VE DEEPSEEK_API_KEY verilince çalışır, o zaman da
# yalnızca ADMIN'e. Anahtar yalnızca ortam değişkeninden okunur, repoya ASLA yazılmaz; yoksa
# uygulama yine açılır, yalnızca tutor devre dışı kalır. Fiyatlar DeepSeek'in fiyat
# sayfasından (USD / 1M token, 2026-10-27'de okundu) -- sayfa değişirse buradaki değerler ve
# pricing.version birlikte güncellenir.
ai:
  tutor:
    enabled: ${AI_TUTOR_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-flash
    timeouts:
      connect: 5s
      total: 60s
    limits:
      max-output-tokens: 1500
      max-message-chars: 4000
      max-context-chars: 60000
      max-answer-chars-stored: 8000
      history-turns: 6
      max-conversations-per-session: 5
      requests-per-user-per-hour: 30
      # Bir konuşmanın session'da tutulan geçmişi (sorular + saklanan cevaplar) için toplam
      # KARAKTER sınırı, token değil. Aşılırsa en eski turlar atılır (TutorConversationStore).
      max-history-chars: 24000
    budget:
      daily-usd: ${AI_TUTOR_DAILY_BUDGET_USD:1.00}
      monthly-usd: ${AI_TUTOR_MONTHLY_BUDGET_USD:10.00}
      alert-ratio: 0.80
      # En kötü durum maliyeti ayrılırken karakter -> token oranı. DeepSeek İngilizce için
      # ~0.3, Çince için ~0.6 token/karakter veriyor; Türkçe için oran vermiyor. 0.5 bilerek
      # İngilizce'nin üstünde tutuldu (bkz. plan §10).
      worst-case-tokens-per-char: 0.5
    pricing:
      version: deepseek-flash-2026-10-27
      off-peak:
        cache-hit-usd-per-million: 0.003
        cache-miss-usd-per-million: 0.15
        output-usd-per-million: 0.60
      peak:
        cache-hit-usd-per-million: 0.006
        cache-miss-usd-per-million: 0.30
        output-usd-per-million: 1.20
      peak-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
      peak-hours-utc:
        - start: 1
          end: 4
        - start: 6
          end: 10

logging:
  level:
    com.cdurgun.learning: DEBUG
