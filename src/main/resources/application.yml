spring:
  application:
    name: learning-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
    # Bu proje Flyway placeholder mekanizmasını (${...}) hiçbir migration'da
    # KASITLI OLARAK kullanmıyor (bkz. CLAUDE.md "Migration dosyalarında
    # literal ${...} yazma" kuralı). spring-mvc-views-thymeleaf konusunun
    # quiz soruları, dersin kendi konusu gereği gerçek Thymeleaf `${...}`
    # sözdizimini soru metni/code_snippet içinde göstermek ZORUNDA -- bu
    # ayar olmadan Flyway bunu bir placeholder sanıp "No value provided for
    # placeholder: ${topic.title}" hatasıyla TÜM uygulamanın başlamasını
    # engelliyor (question-promotion/V699'da GERÇEKTEN doğrulandı).
    # placeholder-replacement: false, bu mekanizmayı proje genelinde
    # devre dışı bırakır -- hiçbir mevcut migration ona bağımlı olmadığı
    # için güvenli, geriye dönük uyumlu bir değişiklik.

server:
  port: 8080

# Şema+host içeren mutlak URL üretmek gereken yerlerde (hreflang, canonical,
# Open Graph/Twitter meta, JSON-LD, sitemap.xml) kullanılır -- bkz. Faz 65 notu.
# Sonda "/" YOK, template'ler ve SitemapController hep kendi "/" ön ekini ekliyor.
# `application-prod.yml` production değerini (https://www.learnforgex.com) eziyor.
app:
  base-url: http://localhost:8080

# Faz D: AI/n8n'in soru havuzuna yazdığı /api/internal/questions/ingest rotasını
# korur (bkz. QuizIngestApiKeyInterceptor). Ortam değişkeni verilmezse BOŞ kalır
# -- interceptor boş bir anahtarla "her isteği kabul et"e DEĞİL, tüm istekleri
# REDDETMEYE düşer (fail-closed), bu yüzden dev/prod'da unutulması sessizce
# güvenlik açığı yaratmaz, yalnızca ingestion'ı devre dışı bırakır.
quiz:
  ingest:
    api-key: ${QUIZ_INGEST_API_KEY:}
  # AI Judge otomatik yayınlama kill switch'i (bkz. QuestionReviewService#autoPublish).
  # Varsayılan olarak DEVRE DIŞI -- /api/internal/questions/{id}/auto-publish, bu
  # bayrak açıkça "true"ya ayarlanmadıkça 503 döner. Aynı X-Api-Key ile korunur
  # (bkz. QuizIngestApiKeyInterceptor), bu ayrı bir kimlik doğrulama DEĞİL, ikinci
  # bir bilinçli açma/kapama anahtarı.
  auto-publish:
    enabled: ${QUIZ_AUTO_PUBLISH_ENABLED:false}

logging:
  level:
    com.cdurgun.learning: DEBUG
