services:
  postgres:
    image: postgres:16-alpine
    container_name: learning-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      # Host'ta 5432'de zaten native bir PostgreSQL çalışabildiğinden, container'ı 5433'e alıyoruz.
      # Container'ın kendi içindeki port hâlâ 5432 (sağdaki değer) — sadece host tarafı değişti.
      - "5433:5432"
    volumes:
      - learning-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learning-db-data:
